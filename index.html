<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LicenseFresh</title>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#eef2f5;margin:0;color:#1f2937}
.top{background:#0a7a42;color:#fff;padding:20px;text-align:center}
.top p{margin:6px 0 0;opacity:.92}
.box{max-width:900px;margin:20px auto;padding:0 15px}
.card{background:#fff;border-radius:12px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.row{display:flex;gap:10px}
input[type="text"]{flex:1;padding:14px;font-size:16px;border:1.5px solid #ddd;border-radius:10px}
input[type="text"]:focus{outline:none;border-color:#0a7a42}
button{padding:14px 20px;background:#0a7a42;color:#fff;border:0;border-radius:10px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6;cursor:not-allowed}
#status{margin-top:12px;padding:12px;border-radius:10px;display:none;font-size:14px}
#viewer{display:none;background:#fff;border-radius:12px;margin-top:16px;padding:20px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
.badge{padding:6px 12px;border-radius:20px;font-weight:700;color:#fff;font-size:13px}
.valid{background:#0a7a42}.expired{background:#e67e22}.notfound,.unknown{background:#c0392b}
#licImg{width:100%;max-height:700px;object-fit:contain;display:none;margin-top:16px;border-radius:10px;filter:contrast(1.15) brightness(1.05)}
#pdfViewer{width:100%;height:600px;border:1px solid #ddd;margin-top:16px;border-radius:10px;display:none}
</style>
</head>
<body>
<div class="top">
  <h1>LicenseFresh</h1>
  <p>Verify your NMDPRA License here</p>
</div>

<div class="box">
  <div class="card">
    <label for="licNo"><b>LICENCE / PERMIT NUMBER</b></label>
    <div class="row" style="margin-top:8px">
      <input id="licNo" type="text" placeholder="e.g. BN14763/2025" value="BN14763/2025">
      <button id="verifyBtn" onclick="verify()">VERIFY →</button>
    </div>
    <div id="status"></div>
  </div>

  <div id="viewer">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
      <b id="vTitle" style="font-size:18px"></b>
      <span id="vBadge" class="badge"></span>
    </div>
    <p id="vDetails" style="color:#333;line-height:1.6"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button onclick="downloadLicence()" style="background:#111">⬇ Download & View Licence Inside App</button>
      <button onclick="shareWhatsApp()" style="background:#25D366">Share on WhatsApp</button>
    </div>

    <iframe id="pdfViewer" title="Licence PDF Viewer"></iframe>

    <input type="file" id="fileInput" accept="image/*,.pdf" style="margin-top:16px;display:block">
    <p style="font-size:13px;color:#666;margin-top:6px">
      If NMDPRA gives no download link, download manually then upload it here to view inside the app.
    </p>
    <img id="licImg" alt="Uploaded Licence Preview">
  </div>
</div>

<script>
let current = null;
const API = '/api/verify';

const licInput = document.getElementById('licNo');
const verifyBtn = document.getElementById('verifyBtn');
const statusEl = document.getElementById('status');
const viewerEl = document.getElementById('viewer');
const pdfViewer = document.getElementById('pdfViewer');
const licImg = document.getElementById('licImg');

licInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') verify();
});

function setStatus(type, message) {
  statusEl.style.display = 'block';
  if (type === 'info') {
    statusEl.style.background = '#e6f9ec';
    statusEl.style.color = '#064e2b';
  } else {
    statusEl.style.background = '#ffecec';
    statusEl.style.color = '#7f1d1d';
  }
  statusEl.textContent = message;
}

async function verify() {
  const lic = licInput.value.trim();
  if (!lic) {
    setStatus('error', 'Please enter a licence or permit number.');
    return;
  }

  verifyBtn.disabled = true;
  setStatus('info', `Verifying ${lic} from NMDPRA inside LicenseFresh...`);
  viewerEl.style.display = 'none';
  pdfViewer.style.display = 'none';
  pdfViewer.removeAttribute('src');

  try {
    const r = await fetch(`${API}?permitNo=${encodeURIComponent(lic)}`);
    const data = await r.json();
    current = data;

    if (!r.ok || !data.ok) {
      setStatus('error', data.error || `✗ NOT FOUND on NMDPRA - ${lic}`);
      return;
    }

    setStatus('info', '✓ Verified from NMDPRA');
    viewerEl.style.display = 'block';
    document.getElementById('vTitle').textContent = `Licence: ${lic}`;

    const badge = document.getElementById('vBadge');
    const st = (data.status || 'UNKNOWN').toUpperCase();
    badge.textContent = st;
    badge.className = 'badge ' + (
      st === 'VALID' ? 'valid' :
      st === 'EXPIRED' ? 'expired' :
      st === 'NOT FOUND' ? 'notfound' : 'unknown'
    );

    document.getElementById('vDetails').innerHTML =
      `<b>Company:</b> ${escapeHtml(data.company || 'See NMDPRA record')}<br>` +
      `<b>Expiry:</b> ${escapeHtml(data.expiry || 'See NMDPRA record')}<br>` +
      `<b>Authenticity:</b> Confirmed from celps.nmdpra.gov.ng`;
  } catch (e) {
    setStatus('error', `Error: ${e.message} - Backend unavailable or network error.`);
  } finally {
    verifyBtn.disabled = false;
  }
}

function downloadLicence() {
  if (!current || !current.proxyDownloadUrl) {
    return alert('No download link returned by NMDPRA for this licence. Use the Upload below with the file you downloaded.');
  }
  licImg.style.display = 'none';
  pdfViewer.style.display = 'block';
  pdfViewer.src = current.proxyDownloadUrl;
  pdfViewer.scrollIntoView({ behavior: 'smooth' });
}

document.getElementById('fileInput').addEventListener('change', (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const objectUrl = URL.createObjectURL(f);

  if (f.type === 'application/pdf' || f.name.toLowerCase().endsWith('.pdf')) {
    licImg.style.display = 'none';
    pdfViewer.style.display = 'block';
    pdfViewer.src = objectUrl;
  } else {
    pdfViewer.style.display = 'none';
    pdfViewer.removeAttribute('src');
    licImg.style.display = 'block';
    licImg.src = objectUrl;
  }
});

function shareWhatsApp() {
  const lic = licInput.value.trim();
  const lines = [
    'LicenseFresh Verified:',
    `Licence: ${lic}`,
    `Status: ${current?.status || 'Verified'}`
  ];
  if (current?.company) lines.push(`Company: ${current.company}`);
  if (current?.expiry) lines.push(`Expiry: ${current.expiry}`);

  window.open(
    'https://wa.me/?text=' + encodeURIComponent(lines.join('\n')),
    '_blank',
    'noopener,noreferrer'
  );
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
</body>
</html>
